@media(max-width:820px){.annual{grid-template-columns:1fr;gap:10px}.annual .day{padding:8px}.annual .mini{gap:2px}.annual .annual-cell{padding:4px 2px}.annual .annual-text{font-size:12px;padding:3px;min-height:48px;height:48px}}

/* Planificación laboral y calendario de consulta */
.tabs{max-width:690px;flex-wrap:wrap}.tabs button{white-space:normal;min-width:80px}
.annual-select{width:100%;min-width:0;border:1px solid #d8cabc;border-radius:4px;background:#fffdf9;color:#654d3e;font:inherit;font-size:11px;padding:3px 0;min-height:26px}

.annual.clean{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.annual.clean .annual-cell{min-height:24px;padding:3px 0;align-items:center;border:0;background:transparent;border-radius:4px}.annual.clean .annual-cell.weekend-day{background:#f0e7db}.annual.clean .annual-cell.current-day{background:#e1cbb3;box-shadow:none}.annual.clean .mini .annual-number{font-size:12px}.annual.clean .day{padding:10px}.annual.clean .mini{gap:2px}
.week .annual-tag{font-size:11px;font-weight:700;line-height:1.3;background:#e8d6bd;color:#654a35;border-radius:5px;padding:3px 5px;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap}
@media(max-width:1050px){.annual.clean{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.annual.clean{grid-template-columns:repeat(2,minmax(0,1fr))}.annual.clean .day{padding:6px}.annual.clean .mini .annual-number{font-size:10px}.annual.clean .month-title{font-size:14px}.week .dayhead,.week .weekend .dayhead{display:grid;grid-template-columns:auto auto 1fr;justify-content:start;align-items:center}.week .dayhead .annual-tag{grid-column:1/-1;grid-row:2;justify-self:start}.week .dayhead .dayload{grid-column:3;grid-row:1;justify-self:end;margin:0}.annual-select{font-size:12px}.tabs button{min-width:70px;font-size:12px}}

@media(min-width:1100px){.week .tasklist,.week .weekend .tasklist{grid-template-columns:repeat(3,minmax(0,1fr))}}

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#f4eee6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">Proyecto piloto · 08</div><h1>Mi agenda</h1><div class="muted">Una semana de un vistazo.</div></div><button class="primary" id="todayBtn">Hoy</button></header>
<nav class="tabs" aria-label="Vistas"><button data-view="week" class="active">Semana</button><button data-view="month">Mes</button><button data-view="year">Vacaciones</button><button data-view="clean">Calendario anual</button></nav>
<section class="bar" aria-label="Navegación"><h2 id="period"></h2><button id="prev" aria-label="Periodo anterior">‹</button><button id="next" aria-label="Periodo siguiente">›</button><input class="jump" type="date" id="jump" aria-label="Ir a una fecha"></section>
<div id="content"></div>
<dialog id="monthEditor" class="month-editor" aria-labelledby="monthEditorTitle"><div class="editor-head"><h2 id="monthEditorTitle"></h2><button id="closeMonthEditor" aria-label="Cerrar">Cerrar</button></div><div id="monthEditorFields"></div><div class="editor-actions"><button id="doneMonthEditor" class="primary">Volver al mes</button></div></dialog>
<footer class="footer"><div><div id="status" class="status" role="status"></div><div>Los datos se guardan en este navegador. Exporta una copia de seguridad.</div></div><div class="footer-actions"><button id="export">Exportar copia</button><button id="import">Importar copia</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div></footer>
</main>
<script>
'use strict';
const KEY='miAgendaPiloto.v4';let store={},anchor=new Date(),view='week';let statusTimer;
const $=s=>document.querySelector(s);const names=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function monday(d){return addDays(d,-((d.getDay()+6)%7))}
function asItems(v){if(Array.isArray(v))return v.filter(x=>x&&typeof x==='object').map(x=>({text:typeof x.text==='string'?x.text:'',time:typeof x.time==='string'?x.time:'',done:!!x.done}));if(typeof v!=='string')return [];return v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>({text:x.replace(/^[✓•]\s*/,''),time:'',done:x.startsWith('✓')}))}
const annualCodes=['LD','VL','DI','EJ'];
function annualKind(e){const note=typeof e.annualNote==='string'?e.annualNote:'';return ['','Otros',...annualCodes].includes(e.annualType)?e.annualType:(annualCodes.includes(note)?note:note?'Otros':'')}
function normalize(e){const personal=Array.isArray(e.personal)||typeof e.personal==='string'?e.personal:[e.events||'',...(Array.isArray(e.tasks)?e.tasks.filter(t=>t.text).map(t=>(t.done?'✓ ':'• ')+t.text):[])].filter(Boolean).join('\n');return {personal:asItems(personal),work:asItems(e.work),training:asItems(e.training),annualNote:typeof e.annualNote==='string'?e.annualNote:'',annualType:annualKind(e),...(e.legacyNotes||e.notes?{legacyNotes:e.legacyNotes||e.notes}:{})}}
function entry(k){return store[k]??={personal:[],work:[],training:[],annualNote:'',annualType:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));showStatus('Cambios guardados ✓')}catch(e){showStatus('No se pudo guardar. Exporta una copia antes de cerrar.')}}
function showStatus(s){$('#status').textContent=s;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').textContent='',2500)}
try{const raw=localStorage.getItem(KEY)||localStorage.getItem('miAgendaPiloto.v3')||localStorage.getItem('miAgendaPiloto.v2')||localStorage.getItem('miAgendaPiloto.v1');if(raw){const old=JSON.parse(raw)||{};store=Object.fromEntries(Object.entries(old).map(([k,e])=>[k,normalize(e)]));}}catch(e){showStatus('No se pudieron recuperar los datos guardados.')}
function element(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function updateLoad(k){let count=document.querySelector('[data-load="'+k+'"]');if(!count)return;let e=store[k],items=['work','training','personal'].flatMap(p=>e[p]).filter(i=>i.text.trim()||i.time),pending=items.filter(i=>!i.done).length;count.textContent=items.length?`${pending} pend. · ${items.length} total`:'Libre';}
function field(label,items,kind,k,options={}){let l=element('section','field '+kind);let head=element('div','fieldhead');head.append(element('span','fieldname',label));let add=element('button','add','+ Añadir');add.type='button';add.setAttribute('aria-label','Añadir en '+label);head.append(add);l.append(head);let list=element('div','tasklist');l.append(list);let getItems=options.getItems||(()=>items);let onAdd=options.onAdd||((item)=>items.push(item));let onRemove=options.onRemove||((item)=>items.splice(items.indexOf(item),1));function changed(){save();updateLoad(k)}function draw(){list.replaceChildren();getItems().forEach(item=>{let row=element('div','agenda-item'+(item.done?' done':''));let check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.setAttribute('aria-label','Marcar como realizado');check.onchange=()=>{item.done=check.checked;row.classList.toggle('done',item.done);changed()};let text=document.createElement('textarea');text.className='item-text';text.rows=1;text.value=item.text;text.placeholder='Descripción…';text.setAttribute('aria-label',label+': descripción');const resize=()=>{text.style.height='auto';text.style.height=Math.max(22,Math.min(120,text.scrollHeight))+'px'};text.oninput=()=>{item.text=text.value;resize();changed()};let del=element('button','del','×');del.type='button';del.setAttribute('aria-label','Eliminar elemento');del.onclick=()=>{if((item.text||item.time)&&!confirm('¿Eliminar este elemento?'))return;onRemove(item);changed();draw()};let time=document.createElement('input');time.className='item-time';time.type='time';time.value=item.time;time.setAttribute('aria-label','Hora opcional');time.onchange=()=>{item.time=time.value;changed()};row.append(check,time,text,del);list.append(row);requestAnimationFrame(resize)})}add.onclick=()=>{let item={text:'',time:'',done:false};onAdd(item);changed();draw();const idx=getItems().indexOf(item);list.children[idx]?.querySelector('textarea').focus()};draw();return l}
function dayCard(d){const k=dateKey(d),e=entry(k),weekend=[0,6].includes(d.getDay());let card=element('section','day'+(k===dateKey(new Date())?' today':'')+(weekend?' weekend':''));let head=element('div','dayhead');let load=element('span','dayload');load.dataset.load=k;head.append(element('h3','',names[d.getDay()]),element('span','date',`${d.getDate()} ${months[d.getMonth()].slice(0,3)}.`));if(e.annualNote.trim()){head.append(element('span','annual-tag',e.annualNote.trim()))}head.append(load);card.append(head);if(weekend){let groups=['work','training','personal'];card.append(field('Agenda del día',null,'weekend-field',k,{getItems:()=>groups.flatMap(p=>e[p]),onAdd:item=>e.personal.push(item),onRemove:item=>{for(const p of groups){let idx=e[p].indexOf(item);if(idx>=0){e[p].splice(idx,1);break}}}}))}else card.append(field('Profesional',e.work,'work',k),field('Entrenamiento',e.training,'training',k),field('Personal',e.personal,'personal',k));return card}
function hasData(k){let e=store[k];return !!(e&&['work','training','personal'].some(p=>e[p].some(i=>i.text||i.time)))}
function monthlyItems(d){const e=store[dateKey(d)];if(!e)return [];return ([0,6].includes(d.getDay())?['work','training','personal'].flatMap(p=>e[p]):e.personal).filter(i=>i.text.trim()||i.time)}
function openMonthEditor(d){const k=dateKey(d),e=entry(k),weekend=[0,6].includes(d.getDay()),dialog=$('#monthEditor');$('#monthEditorTitle').textContent=`${names[d.getDay()]} ${d.getDate()} de ${months[d.getMonth()]}`;const groups=['work','training','personal'];const editor=weekend?field('Agenda del día',null,'weekend-field',k,{getItems:()=>groups.flatMap(p=>e[p]),onAdd:item=>e.personal.push(item),onRemove:item=>{for(const p of groups){const idx=e[p].indexOf(item);if(idx>=0){e[p].splice(idx,1);break}}}}):field('Personal',e.personal,'personal',k);$('#monthEditorFields').replaceChildren(editor);dialog.showModal()}
$('#closeMonthEditor').onclick=()=>$('#monthEditor').close();$('#doneMonthEditor').onclick=()=>$('#monthEditor').close();$('#monthEditor').addEventListener('close',()=>{if(view==='month')render()});
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#jump').value=dateKey(anchor);let root=$('#content');root.replaceChildren();if(view==='week'){let start=monday(anchor),end=addDays(start,6);$('#period').textContent=`${start.getDate()} ${months[start.getMonth()]} – ${end.getDate()} ${months[end.getMonth()]} ${end.getFullYear()}`;let grid=element('div','week');for(let i=0;i<7;i++)grid.append(dayCard(addDays(start,i)));root.append(grid);for(let i=0;i<7;i++)updateLoad(dateKey(addDays(start,i)))}else if(view==='month'){let y=anchor.getFullYear(),m=anchor.getMonth();$('#period').textContent=months[m][0].toUpperCase()+months[m].slice(1)+' '+y;let box=element('div','month'),grid=element('div','monthgrid');['L','M','X','J','V','S','D'].forEach(n=>grid.append(element('div','dow',n)));let first=monday(new Date(y,m,1));let count=Math.ceil((((new Date(y,m,1).getDay()+6)%7)+new Date(y,m+1,0).getDate())/7)*7;for(let i=0;i<count;i++){let d=addDays(first,i),k=dateKey(d),c=element('button','cell'+(d.getMonth()!==m?' out':'')+(k===dateKey(new Date())?' current':''));c.append(element('span','num',d.getDate()));const weekend=[0,6].includes(d.getDay()),items=monthlyItems(d);for(const item of items){c.append(element('small','preview '+(weekend?'weekend':'personal')+(item.done?' done':''),(item.done?'✓ ':'')+(item.time?item.time+' ':'')+(item.text||'Cita')))}c.setAttribute('aria-label',`${d.getDate()} de ${months[d.getMonth()]}, editar ${weekend?'agenda del día':'agenda personal'}`);c.addEventListener('click',()=>openMonthEditor(d));grid.append(c)}box.append(grid);root.append(element('p','month-note','Agenda personal · De lunes a viernes, solo Personal. Sábados y domingos, agenda completa. Pulsa un día para editar.'));root.append(box)}else{let y=anchor.getFullYear(),clean=view==='clean';$('#period').textContent=String(y);root.append(element('p','annual-note',clean?'Calendario anual · Consulta de los doce meses, sin anotaciones.':'Vacaciones y días libres · Selecciona LD, VL, DI, EJ u Otros debajo de cada fecha. La anotación aparece también en la vista semanal.'));let grid=element('div','annual'+(clean?' clean':''));for(let m=0;m<12;m++){let card=element('section','day');card.append(element('h3','month-title',months[m]));let mini=element('div','mini');['L','M','X','J','V','S','D'].forEach(n=>mini.append(element('span','annual-dow',n)));let offset=(new Date(y,m,1).getDay()+6)%7;for(let j=0;j<offset;j++)mini.append(element('div','annual-empty'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let date=new Date(y,m,d),k=dateKey(date),e=store[k]||{},note=e.annualNote||'',kind=annualKind(e);let cell=element('div','annual-cell'+([0,6].includes(date.getDay())?' weekend-day':'')+(!clean&&note.trim()?' has-note':'')+(k===dateKey(new Date())?' current-day':''));cell.append(element('span','annual-number',d));if(!clean){let select=document.createElement('select');select.className='annual-select';select.setAttribute('aria-label',`Tipo de día: ${d} de ${months[m]} de ${y}`);for(const value of ['',...annualCodes,'Otros']){let o=element('option','',value||'—');o.value=value;select.append(o)}select.value=kind;let text=document.createElement('textarea');text.className='annual-text';text.rows=2;text.placeholder='Escribe…';text.value=kind==='Otros'?note:'';text.hidden=kind!=='Otros';text.setAttribute('aria-label',`Otros: ${d} de ${months[m]} de ${y}`);function update(){let row=entry(k);row.annualType=select.value;row.annualNote=select.value==='Otros'?text.value:select.value;cell.classList.toggle('has-note',!!row.annualNote.trim());save()}select.onchange=()=>{if(select.value==='Otros'){text.hidden=false;update();text.focus()}else{text.hidden=true;text.value='';update()}};text.oninput=update;cell.append(select,text)}mini.append(cell)}card.append(mini);grid.append(card)}root.append(grid)}}
function move(n){if(view==='week')anchor=addDays(anchor,n*7);else if(view==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);else anchor=new Date(anchor.getFullYear()+n,0,1);render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#todayBtn').onclick=()=>{anchor=new Date();view='week';render()};$('#jump').onchange=e=>{if(e.target.value){anchor=parse(e.target.value);render()}};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:6,data:store},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`agenda-copia-${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(![1,2,3,4,5,6].includes(o.version)||!o.data||typeof o.data!=='object'||Array.isArray(o.data))throw Error();for(const [k,e] of Object.entries(o.data)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!e||typeof e!=='object'||Array.isArray(e))throw Error();if(o.version>=5&&e.annualNote!==undefined&&typeof e.annualNote!=='string')throw Error();if(o.version===6&&e.annualType!==undefined&&!['','Otros',...annualCodes].includes(e.annualType))throw Error();if(o.version>=3&&['personal','work','training'].some(p=>!Array.isArray(e[p])||e[p].some(i=>!i||typeof i.text!=='string'||typeof i.time!=='string'||typeof i.done!=='boolean')))throw Error();if(o.version===2&&['personal','work','training'].some(p=>typeof e[p]!=='string'))throw Error();if(o.version===1&&(!Array.isArray(e.tasks)||['events','training','notes'].some(p=>typeof e[p]!=='string')))throw Error()}if(confirm('¿Restaurar esta copia? Sustituirá los datos actuales.')){store=Object.fromEntries(Object.entries(o.data).map(([k,e])=>[k,normalize(e)]));save();render()}}catch(err){alert('No se pudo importar. Comprueba que es una copia exportada de esta agenda.')}ev.target.value=''};render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
